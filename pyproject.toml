[project]
name = "olympus"
version = "0.1.0"
license = "MIT"
description = "Zeus: a private AI assistant, calendar and media server that runs on your own PC"
readme = "README.md"
authors = [
    { name = "Olympus contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "anthropic>=1.12.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "libzim>=3.13.1",
    "mutagen>=1.48.1",
    "numpy>=2.5.3",
    "psutil>=7.2.2",
    "pyatv>=0.18.0",
    "pychromecast>=14.0.10",
    "textual>=8.2.8",
    "textual-image>=0.14.1",
    "tomlkit>=0.15.1",
    "websockets>=17.2",
]

[project.scripts]
olympus = "olympus:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
venvPath = "."
venv = ".venv"
